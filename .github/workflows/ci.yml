name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test -- --exclude test/package-consumer.test.ts
            - run: npm run build
            - run: test -f dist/index.d.mts
            - run: npm pack --dry-run --json
              env:
                  npm_config_cache: /tmp/webanvil-npm-cache
            - run: test -f test/package-consumer.test.ts
            - run: npm test -- test/package-consumer.test.ts
